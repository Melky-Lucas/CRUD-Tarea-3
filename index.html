<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Productos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Gestor de Productos</h1>

    <section class="card">
      <h2 id="form-title">Nuevo producto</h2>
      <form id="product-form">
        <div class="form-grid">
          <label>Nombre <input id="name" type="text" required></label>
          <label>Categoría <input id="category" type="text" required></label>
          <label>Precio <input id="price" type="number" min="0" step="0.01" required></label>
          <label>Stock <input id="stock" type="number" min="0" step="1" required></label>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Agregar producto</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Lista de productos</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr>
        </thead>
        <tbody id="product-list"></tbody>
      </table>
    </section>
  </main>
  <script src="dist/main.js"></script>
</body>
</html>
